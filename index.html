
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Pile</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="gallery">
    <div class="pile">

      <button class="frame frame-1" aria-label="Enlarge photograph 1">
        <img src="IMG_20161231_181303749jpg.0.jpg" alt="Photograph 1">
      </button>

      <button class="frame frame-2" aria-label="Enlarge photograph 2">
        <img src="9C4F18E1-8D6D-48F4-9B5D-55878EEA9E54.JPG" alt="Photograph 2">
      </button>

      <button class="frame frame-3" aria-label="Enlarge photograph 3">
        <img src="20230911_120620.jpg" alt="Photograph 3">
      </button>

      <button class="frame frame-4" aria-label="Enlarge photograph 4">
        <img src="DSCN0570.JPG" alt="Photograph 4">
      </button>

      <button class="frame frame-5" aria-label="Enlarge photograph 5">
        <img src="DSCN0642.JPG" alt="Photograph 5">
      </button>

      <button class="frame frame-6" aria-label="Enlarge photograph 6">
        <img src="IMG_2269.JPG" alt="Photograph 6">
      </button>

      <button class="frame frame-7" aria-label="Enlarge photograph 7">
        <img src="Screenshot 2026-10-13 at 2.14.07 PM.jpg" alt="Photograph 7">
      </button>

      <button class="frame frame-8" aria-label="Enlarge photograph 8">
        <img src="P1010120.JPG" alt="Photograph 8">
      </button>

      <button class="frame frame-9" aria-label="Enlarge photograph 9">
        <img src="IMG_7839.jpg" alt="Photograph 9">
      </button>

      <button class="frame frame-10" aria-label="Enlarge photograph 10">
        <img src="IMG_8318.jpg" alt="Photograph 10">
      </button>

      <button class="frame frame-11" aria-label="Enlarge photograph 11">
        <img src="IMG_8906.jpg" alt="Photograph 11">
      </button>

      <button class="frame frame-12" aria-label="Enlarge photograph 12">
        <img src="P1010052.JPG" alt="Photograph 12">
      </button>

    </div>
  </main>

  <!-- Enlarged image viewer -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="close" aria-label="Close viewer">&times;</button>

    <button class="zoom-button zoom-out" id="zoomOut"
      aria-label="Zoom out">−</button>

    <div class="zoom-area" id="zoomArea">
      <img id="enlargedImage" src="" alt="Enlarged photograph">
    </div>

    <button class="zoom-button zoom-in" id="zoomIn"
      aria-label="Zoom in">+</button>

    <p class="viewer-hint">Scroll to zoom · Click outside to close</p>
  </div>

  <script>
    const frames = document.querySelectorAll(".frame");
    const lightbox = document.getElementById("lightbox");
    const enlargedImage = document.getElementById("enlargedImage");
    const closeButton = document.getElementById("close");
    const zoomArea = document.getElementById("zoomArea");

    let zoom = 1;

    function updateZoom() {
      enlargedImage.style.transform = `scale(${zoom})`;
    }

    function openLightbox(frame) {
      const image = frame.querySelector("img");

      enlargedImage.src = image.src;
      enlargedImage.alt = image.alt;
      zoom = 1;
      updateZoom();

      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      enlargedImage.src = "";
    }

    frames.forEach(frame => {
      frame.addEventListener("click", () => openLightbox(frame));
    });

    closeButton.addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closeLightbox();
    });

    document.getElementById("zoomIn").addEventListener("click", () => {
      zoom = Math.min(zoom + 0.25, 4);
      updateZoom();
    });

    document.getElementById("zoomOut").addEventListener("click", () => {
      zoom = Math.max(zoom - 0.25, 0.5);
      updateZoom();
    });

    zoomArea.addEventListener("wheel", event => {
      event.preventDefault();

      zoom += event.deltaY < 0 ? 0.15 : -0.15;
      zoom = Math.max(0.5, Math.min(zoom, 4));
      updateZoom();
    }, { passive: false });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeLightbox();

      if (lightbox.classList.contains("active")) {
        if (event.key === "+" || event.key === "=") {
          zoom = Math.min(zoom + 0.25, 4);
          updateZoom();
        }

        if (event.key === "-") {
          zoom = Math.max(zoom - 0.25, 0.5);
          updateZoom();
        }
      }
    });
  </script>

</body>
</html>
